<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール - プチプリンランド</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <h1>🌸 プチプリンランド 🌸</h1>
    <p>ゲーム制作者・プチプリンちゃんのおへや</p>
  </header>

  <!-- ナビゲーションメニュー -->
  <nav>
    <a href="index.html">TOP</a>
    <a href="profile.html" class="active">プロフィール</a>
    <a href="games.html">ゲーム紹介</a>
    <a href="characters.html">キャラチップ</a>
    <a href="links.html">リンク</a>
  </nav>

  <!-- メインコンテンツ -->
  <main>

    <h2>🐰 プロフィール</h2>

    <!-- ひとことメッセージ -->
    <div class="card" style="text-align: center; font-size: 1.1em; color: #d45f7a; font-weight: 500;">
      💬 かわいいゲームが大好きです！
    </div>

    <!-- プロフィール情報 -->
    <div class="card">
      <table class="profile-table">
        <tr>
          <th>🏷️ 名前</th>
          <td>プチプリンちゃん</td>
        </tr>
        <tr>
          <th>🎂 誕生日</th>
          <td>7月4日</td>
        </tr>
        <tr>
          <th>🐾 好きな動物</th>
          <td>ウサギ</td>
        </tr>
        <tr>
          <th>🌸 好きな花</th>
          <td>カスミソウ</td>
        </tr>
        <tr>
          <th>🎨 趣味</th>
          <td>ドット絵を描くこと</td>
        </tr>
      </table>
    </div>

    <!-- 使用ツール -->
    <div class="card">
      <h2>🛠️ よく使うツール</h2>
      <div class="tool-list">
        <div class="tool-item">
          <span class="tool-icon">🎮</span>
          <div>
            <strong>RPGツクールMZ</strong>
            <p>ゲーム制作に使っています</p>
          </div>
        </div>
        <div class="tool-item">
          <span class="tool-icon">🖼️</span>
          <div>
            <strong>Aseprite</strong>
            <p>ドット絵制作に使っています</p>
          </div>
        </div>
      </div>
    </div>

    <!-- SNSリンク -->
    <div class="card">
      <h2>📱 SNS</h2>
      <a href="https://x.com/putipurin_game" target="_blank" class="btn sns-btn">
        X（Twitter）をフォローする
      </a>
    </div>

  </main>

  <!-- フッター -->
  <footer>
    <p>© プチプリンランド</p>
  </footer>

</body>
</html>
